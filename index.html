<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Troller Coaster</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030006;
  font-family: Arial, sans-serif;
}

.site {
  width: 100%;
  display: flex;
  justify-content: center;
  background: #030006;
}

.site img {
  width: 100%;
  max-width: 1400px;
  height: auto;
  display: block;
}

.nav-buttons {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  z-index: 999;
}

.nav-buttons button {
  background: linear-gradient(135deg, #b700ff, #6100ff);
  color: white;
  border: 1px solid #d65cff;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 0 18px #8b00ff;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="site">
  <img id="homePage" src="home.png" alt="Troller Coaster Home Page">
  <img id="whitepaperPage" class="hidden" src="whitepaper.png" alt="Troller Coaster Whitepaper">
</div>

<div class="nav-buttons">
  <button onclick="showPage('home')">HOME</button>
  <button onclick="showPage('whitepaper')">WHITEPAPER</button>
</div>

<script>
function showPage(page) {
  const home = document.getElementById("homePage");
  const whitepaper = document.getElementById("whitepaperPage");

  if (page === "home") {
    home.classList.remove("hidden");
    whitepaper.classList.add("hidden");
  } else {
    whitepaper.classList.remove("hidden");
    home.classList.add("hidden");
  }

  window.scrollTo(0, 0);
}
</script>

</body>
</html>
